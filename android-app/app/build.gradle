plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tupai.dgtempo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tupai.dgtempo'
        minSdk 26
        targetSdk 35
        // CI passes -PversionName=1.0.<run number> -PversionCode=<1000 + run number>
        // (see .github/workflows/android-release.yml). Local builds are 1.0.0-dev, code 999: above the old
        // 0.33 builds so they still install over them, below every CI build.
        versionCode = ((project.findProperty('versionCode') ?: '999') as String).toInteger()
        versionName = (project.findProperty('versionName') ?: '1.0.0-dev') as String
        ndk { abiFilters 'arm64-v8a' }      // ML Kit / TFLite natives for one ABI only: keeps the APK small
    }
    // CI signing: the workflow decodes a keystore and sets these env vars. Locally (no env) the
    // debug keystore is used, so both builds install over each other only if the SAME keystore is
    // used in both places (see README "Release pipeline").
    signingConfigs {
        ci {
            def ksPath = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: 'android'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('ANDROID_KEYSTORE_FILE') ? signingConfigs.ci : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Chalk Cage: camera + on-device person segmentation (no face/pose needed, nothing leaves the phone)
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
    testImplementation 'junit:junit:4.13.2'
}

// AndroidX pulls kotlin-stdlib-jdk7/jdk8 1.6 next to kotlin-stdlib 1.8 (duplicate classes). Align them.
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
              'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
              'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
