plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tupai.dgtempo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tupai.dgtempo'
        minSdk 26
        targetSdk 35
        versionCode 33
        versionName '0.33'
    }
    // CI signing: the workflow decodes a keystore and sets these env vars. Locally (no env) the
    // debug keystore is used, so both builds install over each other only if the SAME keystore is
    // used in both places (see README "Release pipeline").
    signingConfigs {
        ci {
            def ksPath = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: 'android'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('ANDROID_KEYSTORE_FILE') ? signingConfigs.ci : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'
}

// AndroidX pulls kotlin-stdlib-jdk7/jdk8 1.6 next to kotlin-stdlib 1.8 (duplicate classes). Align them.
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
              'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
              'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
